<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <div>
        <p class="eyebrow">Welcome back</p>
        <h2>Sign in to Quantity Measure</h2>
        <p class="auth-subtitle">Secure access to compare, convert and track quantity operations through your backend service.</p>
      </div>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" placeholder="you@example.com" />
        <small class="error" *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.hasError('required')">
          Email is required
        </small>
        <small class="error" *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.hasError('email')">
          Enter a valid email address
        </small>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" type="password" formControlName="password" placeholder="Enter password" />
        <small class="error" *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.hasError('required')">
          Password is required
        </small>
      </div>

      <div class="api-error" *ngIf="errorMessage">{{ errorMessage }}</div>

      <button type="submit" class="primary-btn" [disabled]="loading || loginForm.invalid">
        <span>{{ loading ? 'Signing in...' : 'Sign in' }}</span>
      </button>
    </form>

    <div class="footer-text">
      <span>New here?</span>
      <button type="button" class="link-btn" (click)="navigateToRegister()">Create an account</button>
    </div>
  </div>
</div>
